<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LTO MORONG Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen 1: sign up or log in -->
  <main id="auth-screen" class="chat auth">
    <h1>LTO MORONG</h1>
    <p class="subtitle">Log in to join the conversation.</p>

    <form id="auth-form">
      <label for="display-name">Display name (sign up only)</label>
      <input id="display-name" type="text" maxlength="24"
             placeholder="Your name or nickname">

      <label for="email">Email</label>
      <input id="email" type="email" required placeholder="you@school.com">

      <label for="password">Password (at least 8 characters)</label>
      <input id="password" type="password" minlength="8" required>

      <div class="auth-buttons">
        <button type="submit" id="login-btn">Log in</button>
        <button type="button" id="signup-btn" class="ghost">Sign up</button>
      </div>
    </form>
    <p id="auth-message" class="auth-message" role="status"></p>
  </main>

  <!-- Screen 2: the chat room -->
  <main id="chat-screen" class="chat" hidden>
    <header class="chat-header">
      <h1>LTO MORONG</h1>
      <div class="controls">
        <span id="who">Signed in</span>
        <button id="logout-btn" type="button" class="ghost">Log out</button>
      </div>
    </header>
  
<div class="online-panel">
  <strong>Online now</strong>
  <span id="online-count">0</span>
  <ul id="online-users"></ul>
</div>

    <div class="chat-tools" aria-label="Chat customization">
      <label class="tool-button" for="background-picker" title="Choose a chat background">🖼️ Background</label>
      <input id="background-picker" type="file" accept="image/*" hidden>
      <button id="clear-background" type="button" class="ghost tool-button">Clear background</button>
      <button id="emoji-toggle" type="button" class="ghost tool-button" aria-expanded="false" aria-controls="emoji-picker">😊 Emoji</button>
    </div>
    <div id="emoji-picker" class="emoji-picker" hidden aria-label="Choose an emoji">
      <button type="button" class="emoji-choice" aria-label="Grinning face">😀</button>
      <button type="button" class="emoji-choice" aria-label="Laughing">😂</button>
      <button type="button" class="emoji-choice" aria-label="Heart eyes">😍</button>
      <button type="button" class="emoji-choice" aria-label="Thumbs up">👍</button>
      <button type="button" class="emoji-choice" aria-label="Heart">❤️</button>
      <button type="button" class="emoji-choice" aria-label="Cat face">🐱</button>
      <button type="button" class="emoji-choice" aria-label="Party popper">🎉</button>
      <button type="button" class="emoji-choice" aria-label="Sparkles">✨</button>
      <button type="button" class="emoji-choice" aria-label="Crying laughing">🤣</button>
      <button type="button" class="emoji-choice" aria-label="Wave">👋</button>
      <button type="button" class="emoji-choice" aria-label="Fire">🔥</button>
      <button type="button" class="emoji-choice" aria-label="Smiling face with hearts">🥰</button>
    </div>

    <ul id="messages" class="messages" aria-live="polite"></ul>

    <div id="liptus-stage" class="liptus-stage" aria-label="Interactive pet cat">
      <div id="liptus" class="liptus" role="button" tabindex="0" aria-label="Liptus the pet cat. Tap to pet, drag to move.">
        <span class="cat-emoji" aria-hidden="true">🐶</span>
        <span class="liptus-name">Liptus</span>
        <span class="liptus-hint">pet me!</span>
      </div>
    </div>

    <form id="message-form" class="composer" autocomplete="off">
      <label for="message-input" class="visually-hidden">Message</label>
      <input id="message-input" type="text" maxlength="500" required
             placeholder="Type a message or /weather Manila">
      <button type="submit">Send</button>
    </form>
  </main>

  <script
     src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1"
  ></script>
  <script src="script.js"></script>
</body>
</html>
